// ================================
// Stateful Sentiment Aggregation
// ================================

message SentimentAggregationRequest {
  string key = 1;              // topic, user, or session ID
  string input_text = 2;       // raw text input
  string req_id = 3;           // unique request identifier (UUID from orchestrator)
  int64 request_time_ms = 4;   // client-side timestamp
}

message SentimentAggregationResponse {
  string key = 1;
  string req_id = 2;
  double polarity = 3;         // aggregated polarity (-1 to +1)
  double subjectivity = 4;     // aggregated subjectivity (0 to 1)
  int64 state_version = 5;     // monotonic version counter
  bool applied = 6;            // false if duplicate req_id was ignored
  int64 request_time_ms = 7;   // original request time
  int64 request_received_time_ms = 8;
  int64 response_time_ms = 9;
  int64 response_received_time_ms = 10;
}

// ================================
// SLAM-VF (ordered video frames, stateful per-session SLAM)
// ================================

message SLAMVFRequest {
  string session_id = 1;       // identifies the SLAM session/track
  int64 frame_id = 2;          // sequential frame index (0-based or dataset-native)
  string frame = 3;            // base64-encoded image bytes (gRPC frame transfer)
  bool reset = 4;              // if true, drop any prior state for this session before processing
  int64 request_time_ms = 5;   // client-side timestamp
  string req_id = 6;           // idempotency token; under ACTIVE replication the same
                               //   req_id arrives at every replica — duplicates skip state update
}

message SLAMVFResponse {
  string session_id = 1;
  int64 frame_id = 2;
  bool tracked = 3;            // pose was estimated against the previous frame
  int32 num_features = 4;      // keypoints detected on this frame
  int32 num_matches = 5;       // matches with the previous frame
  int32 num_map_points = 6;    // total accumulated map points for the session
  int32 num_keyframes = 7;     // total keyframes inserted for the session
  repeated float pose = 8;     // accumulated 4x4 camera pose, row-major (16 floats)
  int64 state_version = 9;     // monotonic per-session frame counter
  int64 request_time_ms = 10;
  int64 request_received_time_ms = 11;
  int64 response_time_ms = 12;
  int64 response_received_time_ms = 13;
  int32 num_inliers = 14;      // RANSAC inliers used to recover pose
  int32 frame_bytes_size = 15; // size of the request frame payload in bytes (server-echoed)
  bool applied = 16;           // false if the request was a duplicate (req_id already seen)
}

// ===== Role & peer config =====
enum Role {
  ROLE_UNKNOWN = 0;
  ROLE_PRIMARY = 1;
  ROLE_BACKUP  = 2;
}

message SetRoleAndPeersRequest {
  Role role = 1;
  repeated string peer_hosts = 2;  // IPs/hostnames of all other replicas
}

message SetCheckpointPeriodRequest {
  int32 seconds = 1;
  string app = 2;   // optional: "SA-AGG" | "SLAM-VF". Empty = applies to all stateful apps.
}

message Ack {
  bool ok = 1;
  string msg = 2;
}

// ===== Checkpointing =====
message VersionRequest {
  string key = 1;
  string app = 2;   // "SA-AGG" | "SLAM-VF"; empty defaults to SA-AGG for back-compat
}

message VersionResponse {
  string key = 1;
  int64 state_version = 2;
  string app = 3;   // echoes the resolved app
}

// Compact per-keyframe metadata for SLAM-VF checkpoints (no raw frames).
message SLAMKeyframeRecord {
  int64 frame_id = 1;
  float tx = 2;
  float ty = 3;
  float tz = 4;
  float theta = 5;
  int32 num_inliers = 6;   // ~map points contributed by this keyframe
}

message SLAMSessionSnapshot {
  string video_id = 1;
  int64 state_version = 2;
  int64 last_frame_id = 3;
  float pose_x = 4;
  float pose_y = 5;
  float pose_theta = 6;
  int32 keyframe_count = 7;
  int32 map_point_count = 8;
  repeated SLAMKeyframeRecord keyframes = 9; // compact keyframe metadata
}

// Compact per-frame log entry used for SLAM-VF incremental recovery.
// Carries metadata only — no raw frame bytes, no ORB descriptors.
message SLAMFrameLogEntry {
  int64 version = 1;     // state version after this frame
  int64 frame_id = 2;
  bool tracked = 3;
  int32 num_features = 4;
  int32 num_matches = 5;
  int32 num_inliers = 6;
  bool was_keyframe = 7; // whether this frame became a keyframe
  // Cumulative pose AFTER processing (X-Z plane + yaw about world Y).
  float pose_x = 8;
  float pose_y = 9;
  float pose_theta = 10;
}

// Compact per-update log entry used for SA-AGG incremental recovery.
// Carries the already-scored polarity/subjectivity — never the raw input text.
message SAAGGLogEntry {
  int64 version = 1;       // state version after this update
  string key = 2;          // aggregator key
  string req_id = 3;       // idempotency token
  double polarity = 4;     // per-update polarity scored by TextBlob (-1..+1)
  double subjectivity = 5; // per-update subjectivity scored by TextBlob (0..1)
}

message LogTailRequest {
  string app = 1;            // "SLAM-VF" | "SA-AGG"
  string key = 2;            // SLAM-VF: session id; SA-AGG: aggregator key
  int64 since_version = 3;   // return entries with version > since_version
}

message LogTail {
  string app = 1;
  string key = 2;
  int64 from_version = 3;   // exclusive lower bound (snapshot's version)
  int64 to_version = 4;     // inclusive upper bound (last entry's version)
  repeated SLAMFrameLogEntry slam_entries = 5;
  repeated SAAGGLogEntry sa_entries = 6;
}

message CheckpointSnapshot {
  int64 version = 1;
  string last_op_id = 2;
  // SA-AGG state: key -> entry. Other apps leave this empty.
  message Entry {
    double polarity = 1;
    double subjectivity = 2;
    repeated double window_p = 3; // polarity window
    repeated double window_s = 4; // subjectivity window
  }
  map<string, Entry> state = 3;
  // Generalization: identifies which app/key this snapshot belongs to.
  // Empty app is treated as "SA-AGG" for back-compat with legacy callers.
  string app = 4;
  string key = 5;
  SLAMSessionSnapshot slam = 6;
}

/********************************************************
*********************************************************
END: The above messages are for application-benchmarks
*********************************************************
********************************************************/
message ResourceTracingRequest {
  int32 timeout = 1;
}

message ResourceUtilizationResponse{
  float average_cpu_utilization = 1;
  float average_memory_utilization = 2;
  float average_disk_utilization = 3;
  float average_network_received_speed = 4;
  float average_network_transmitted_speed = 5;
  float average_power_consumption = 6;
}

message FaultRequest{
  string fault_command = 1;
  string fault_config = 2;
}

message FaultRequestWithDelay{
  string fault_command = 1;
  string fault_config = 2;
  int32 delay = 3;
}

message ResourceLogs{
  FileData cpu_log = 1;
  FileData memory_log = 2;
  FileData io_log = 3;
  FileData network_log = 4;
  repeated int64 fault_injection_start_times_ms = 5;
  repeated int64 fault_injection_stop_times_ms = 6;
  repeated int64 temperature_timestamps_ms = 7;
  repeated float cpu_temperatures = 8;
}

message ProcessStatus {
  bool is_finished = 1;
}

message DetectedTrackedObject {
  int32 track_id = 1;
  string clazz = 2;
  int32 x_min = 3;
  int32 x_max = 4;
  int32 y_min = 5;
  int32 y_max = 6;
}

message EmptyProto {}
